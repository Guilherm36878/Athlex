<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-estar | ATHLEX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #071116 0%, #091b22 100%);
      color: #edf6ff;
    }
    .page-shell {
      padding: 28px;
    }
    .content-card {
      background: rgba(12, 23, 29, 0.82);
      border: 1px solid rgba(103, 255, 160, 0.18);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.28);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 20px;
      color: #b8cbd8;
      line-height: 1.6;
    }
    .wellness-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 26px;
    }
    .item {
      padding: 18px;
      border-radius: 16px;
      background: rgba(17, 34, 40, 0.8);
      border: 1px solid rgba(131, 167, 255, 0.14);
    }
    .item strong { display:block; margin-bottom:10px; font-size:0.9rem; color:#9cc7ff; }
    .item span { color:#edf6ff; font-weight:700; }
    .item small { display:block; margin-top:6px; color:#9babbb; }
    .form-card {
      background: rgba(15, 30, 35, 0.9);
      border: 1px solid rgba(103, 255, 160, 0.14);
      border-radius: 22px;
      padding: 24px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      color: #d0e2f2;
      font-size: 0.9rem;
      font-weight: 700;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid rgba(160, 176, 195, 0.18);
      border-radius: 12px;
      background: rgba(9, 17, 22, 0.7);
      color: #edf6ff;
      padding: 12px 14px;
      font: inherit;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    .actions {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }
    button {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6ef7a7, #38d39f);
      color: #061911;
      font-weight: 800;
      padding: 12px 22px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="content-card">
      <h1>Bem-estar</h1>
      <p>Registre sono, fadiga, humor, dor muscular e percepção de esforço para acompanhar sua recuperação e desempenho.</p>

      <div class="wellness-grid">
        <div class="item">
          <strong>Sono</strong>
          <span>7h 30m</span>
          <small>Tempo total dormido</small>
        </div>
        <div class="item">
          <strong>Fadiga</strong>
          <span>Moderada</span>
          <small>Nível de cansaço</small>
        </div>
        <div class="item">
          <strong>Humor</strong>
          <span>Positivo</span>
          <small>Estado emocional</small>
        </div>
        <div class="item">
          <strong>Dor muscular</strong>
          <span>Leve</span>
          <small>Intensidade da dor</small>
        </div>
      </div>

      <div class="form-card">
        <form>
          <div class="form-grid">
            <div class="field">
              <label for="sono">Sono (horas)</label>
              <input id="sono" type="number" min="0" max="24" step="0.5" value="7.5" placeholder="Ex: 7.5">
            </div>

            <div class="field">
              <label for="fadiga">Fadiga</label>
              <select id="fadiga">
                <option>Baixa</option>
                <option selected>Moderada</option>
                <option>Alta</option>
              </select>
            </div>

            <div class="field">
              <label for="humor">Humor</label>
              <select id="humor">
                <option>Excelente</option>
                <option selected>Bom</option>
                <option>Neutro</option>
                <option>Baixo</option>
              </select>
            </div>

            <div class="field">
              <label for="dor">Dor muscular</label>
              <select id="dor">
                <option>Nenhuma</option>
                <option selected>Leve</option>
                <option>Moderada</option>
                <option>Intensa</option>
              </select>
            </div>

            <div class="field">
              <label for="esforco">Percepção de esforço</label>
              <select id="esforco">
                <option>1 - Muito leve</option>
                <option>2 - Leve</option>
                <option selected>3 - Moderado</option>
                <option>4 - Alto</option>
                <option>5 - Extremamente alto</option>
              </select>
            </div>

            <div class="field">
              <label for="data">Data</label>
              <input id="data" type="date" value="2026-08-29">
            </div>
          </div>

          <div class="actions">
            <button type="submit">Salvar registro</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
