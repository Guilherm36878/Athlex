<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios | ATHLEX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #071116 0%, #091b22 100%);
      color: #edf6ff;
    }
    .page-shell { padding: 28px; }
    .content-card {
      background: rgba(12, 23, 29, 0.82);
      border: 1px solid rgba(103, 255, 160, 0.18);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 22px 50px rgba(0,0,0,0.28);
    }
    h1 { margin: 0 0 10px; font-size: 2rem; letter-spacing: -0.04em; }
    p { margin: 0 0 20px; color: #b8cbd8; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .metric {
      background: rgba(17, 34, 40, 0.8);
      border: 1px solid rgba(131, 167, 255, 0.14);
      border-radius: 16px;
      padding: 18px;
    }
    .metric span { display:block; color:#9babbb; margin-bottom:8px; font-size:0.8rem; }
    .metric strong { font-size:1.5rem; }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="content-card">
      <h1>Relatórios</h1>
      <p>Evolução de desempenho, indicadores e comparativos por período.</p>

      <div class="grid">
        <div class="metric">
          <span>Força</span>
          <strong>+12%</strong>
        </div>
        <div class="metric">
          <span>Resistência</span>
          <strong>+9%</strong>
        </div>
        <div class="metric">
          <span>Velocidade</span>
          <strong>+7%</strong>
        </div>
        <div class="metric">
          <span>Recuperação</span>
          <strong>85%</strong>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
